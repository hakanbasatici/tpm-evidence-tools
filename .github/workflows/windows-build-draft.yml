name: Manual Windows build and portable tests
on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type BUILD_AND_PORTABLE_TEST_ONLY'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: tpm-tools-manual-build
  cancel-in-progress: false
jobs:
  compile:
    if: github.repository == 'hakanbasatici/tpm-evidence-tools' && github.actor == 'hakanbasatici' && inputs.approval == 'BUILD_AND_PORTABLE_TEST_ONLY'
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Verify reviewed compile inputs
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @{
            'CMakeLists.txt' = '2763aab568c2dcc52632f2b1d976a12459ff70db3439c8de75c595016cc60ebc'
            'src/EphemeralClaim.cpp' = 'c1ea08af1ac52110d50015c917a594be5bcb7e7d6f68c3fc68aabdd20eb85214'
            'src/PcrBanks.cpp' = '44ee5419a39eb82995b433ee04c4f54f756b071163eed443c8e1a4ec5bad1d51'
            'src/InputContract.h' = 'd95bd73db52eff4fc50e9b11ce9f97c507a4336b87defb13ecb0fa75a13277a0'
            'src/Version.rc' = 'cebb6715dfdd8b2c7fb500207abc4b3fe303f188625775c78a8d0550f45014b1'
            'src/ProfileCreation.h' = 'd53887c86a3ce5f19838e2ddba46df74a2552b565899853b20e4fd2557da70b3'
            'tests/ProfileAndInput.test.cpp' = '4f3892a5a8c96625ba3e4de9df5fe6a028320ce3fe37deabbea141d91cafe4d9'
          }
          git ls-files --eol -- @($expected.Keys)
          if ($LASTEXITCODE -ne 0) { throw 'EOL_DIAGNOSTIC_FAILED' }
          foreach ($path in $expected.Keys) {
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $expected[$path]) {
              throw "REVIEWED_INPUT_MISMATCH: $path expected=$($expected[$path]) actual=$actual"
            }
          }
          if ((git rev-parse HEAD).Trim() -cne $env:GITHUB_SHA) { throw 'CHECKOUT_SHA_MISMATCH' }
          'REVIEWED_INPUTS = PASS'
      - name: Configure using existing MSVC and SDK
        run: |
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw "CONFIGURE_FAILED_$LASTEXITCODE" }
      - name: Compile helpers and portable test
        run: |
          cmake --build build --config Release --target PcrBanks EphemeralClaim ProfileAndInputTests
          if ($LASTEXITCODE -ne 0) { throw "BUILD_FAILED_$LASTEXITCODE" }
      - name: Run only the portable no-TPM test once
        timeout-minutes: 2
        run: |
          ctest --test-dir build -C Release -R '^profile-and-input$' --output-on-failure --verbose
          if ($LASTEXITCODE -ne 0) { throw "PORTABLE_TEST_FAILED_$LASTEXITCODE" }
      - name: Package outputs and build provenance
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path ci-review -ErrorAction Stop | Out-Null
          $files = @('PcrBanks.exe', 'EphemeralClaim.exe')
          $binaryHashes = @{}
          foreach ($name in $files) {
            $inputPath = Join-Path 'build/Release' $name
            $binaryHashes[$name] = (Get-FileHash -LiteralPath $inputPath -Algorithm SHA256).Hash.ToLowerInvariant()
            Copy-Item -LiteralPath $inputPath -Destination (Join-Path 'ci-review' $name)
          }
          Copy-Item -LiteralPath 'LICENSE' -Destination 'ci-review/LICENSE'
          Copy-Item -LiteralPath 'build/Testing/Temporary/LastTest.log' -Destination 'ci-review/portable-test.log'
          Copy-Item -LiteralPath 'build/CMakeCache.txt' -Destination 'ci-review/CMakeCache.txt'
          $sourceHashes = @{}
          $sourcePaths = @('CMakeLists.txt','src/EphemeralClaim.cpp','src/PcrBanks.cpp','src/InputContract.h','src/Version.rc','src/ProfileCreation.h','tests/ProfileAndInput.test.cpp')
          foreach ($path in $sourcePaths) {
            $sourceHashes[$path] = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $record = [ordered]@{
            schemaVersion = 1
            repository = $env:GITHUB_REPOSITORY
            sourceCommit = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            workflowRef = $env:GITHUB_WORKFLOW_REF
            runnerImage = $env:ImageOS
            runnerImageVersion = $env:ImageVersion
            cmakeVersion = (cmake --version | Select-Object -First 1)
            sourceSha256 = $sourceHashes
            binarySha256 = $binaryHashes
            portableTest = 'PASSED'
            diagnosticHelperStarts = 0
            hardwareTpmCallsRequested = 0
            binaryReleasePublished = $false
            codeSigned = $false
            independentReproducibleBuildVerified = $false
          }
          $record | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath 'ci-review/BUILD-PROVENANCE.json' -Encoding utf8
          'UNSIGNED BUILD REVIEW ONLY. Diagnostic helpers were not started. This is not a release, signed attestation, or proof of bit-reproducible output.' | Set-Content -LiteralPath 'ci-review/README.txt' -Encoding utf8
      - name: Upload review files only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tpm-tools-windows-build-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-review/*
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
